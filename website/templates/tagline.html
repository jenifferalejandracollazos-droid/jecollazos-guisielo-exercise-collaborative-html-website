<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Page Wonder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <style>
        .header-bg {
            background-image: url('./assets/img/bg.jpg');
            background-size: cover;
            background-position: center;
            height: 100vh;
            position: relative;
        }

        .header-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
        }

        .text-box {
            position: relative;
            z-index: 1;
            background-color: rgba(255, 255, 255, 0.85);
        }

        .text-box-inner {
            padding: 1.5rem;
        }

        /* Alinea la caja blanca al 100% de ancho de la pantalla */
        .full-width-box {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 100%;
        }
    </style>
</head>
<body>

    <header class="header-bg d-flex align-items-center justify-content-center text-center text-white">
        <div class="header-overlay"></div>
        
        <div class="full-width-box">
            <div class="text-box container-flex">
                <div class="text-box-inner">
                    <div class="row">
                    <li><h1 class="display-1 fw-bold text-dark mb-0">One Page Wonder</h1></li>
                    <li><h2 class="display-6 fw-normal text-dark">Will Knock Your Socks Off</h2></li>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
